<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tarefas</title>
<style>
:root{
  --bg:#f7f8fa;--surface:#fff;--surface2:#f1f3f5;--text:#202124;--muted:#6b7280;
  --border:#e5e7eb;--accent:#4f46e5;--accent-soft:#eef2ff;--danger:#dc2626;
  --shadow:0 8px 28px rgba(15,23,42,.08);--radius:14px;
}
[data-theme="dark"]{
  --bg:#111318;--surface:#191c22;--surface2:#232731;--text:#f3f4f6;--muted:#a1a7b3;
  --border:#30343e;--accent:#818cf8;--accent-soft:#24274a;--danger:#f87171;
  --shadow:0 8px 28px rgba(0,0,0,.25);
}
*{box-sizing:border-box} body{margin:0;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--text)}
button,input,textarea,select{font:inherit} button{cursor:pointer}
.app{display:flex;min-height:100vh}.sidebar{width:245px;background:var(--surface);border-right:1px solid var(--border);padding:22px 14px;position:fixed;inset:0 auto 0 0;z-index:10}
.logo{font-size:22px;font-weight:800;padding:5px 12px 24px}.logo span{color:var(--accent)}
.nav button,.bottom-action{display:flex;width:100%;align-items:center;gap:12px;border:0;background:transparent;color:var(--muted);padding:11px 13px;border-radius:10px;text-align:left;margin:3px 0}
.nav button.active,.nav button:hover,.bottom-action:hover{background:var(--accent-soft);color:var(--accent)}
.sidebar-bottom{position:absolute;bottom:18px;left:14px;right:14px}.user-card{border-top:1px solid var(--border);padding-top:14px;margin-top:10px}
.user-btn{display:flex;gap:10px;align-items:center;width:100%;border:0;background:transparent;color:var(--text);padding:9px;border-radius:10px;text-align:left}
.avatar{width:36px;height:36px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;font-weight:700}
.main{margin-left:245px;width:calc(100% - 245px);padding:26px 32px 50px}.topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px}
.page-title{font-size:28px;font-weight:750}.top-actions{display:flex;gap:9px;align-items:center}.icon-btn,.secondary,.primary{border:1px solid var(--border);background:var(--surface);color:var(--text);border-radius:10px;padding:9px 12px}
.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:650}.secondary:hover,.icon-btn:hover{background:var(--surface2)}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}.chip{border:1px solid var(--border);background:var(--surface);color:var(--muted);padding:7px 10px;border-radius:999px;font-size:13px}.chip.active{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.progress-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:17px 18px;margin-bottom:18px;box-shadow:var(--shadow)}
.progress-row{display:flex;justify-content:space-between;font-size:14px;margin-bottom:10px}.progress{height:8px;background:var(--surface2);border-radius:20px;overflow:hidden}.progress>span{display:block;height:100%;background:var(--accent);border-radius:20px}
.task-section{margin-bottom:20px}.section-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:9px}.section-head h3{font-size:14px;color:var(--muted);margin:0;font-weight:650;text-transform:uppercase;letter-spacing:.04em}
.task-list{display:grid;gap:8px}.task{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:12px 14px;transition:.15s}.task:hover{box-shadow:var(--shadow);transform:translateY(-1px)}
.check{width:21px;height:21px;border:1.5px solid #aab0bb;border-radius:50%;display:grid;place-items:center;flex:none;background:transparent;color:#fff}.check.done{background:var(--accent);border-color:var(--accent)}.task-main{min-width:0;flex:1}.task-title{font-weight:600}.task.done .task-title{text-decoration:line-through;color:var(--muted)}.task-meta{display:flex;gap:8px;align-items:center;flex-wrap:wrap;color:var(--muted);font-size:12px;margin-top:4px}.cat-dot{width:8px;height:8px;border-radius:50%;display:inline-block}.task-time{font-weight:650;color:var(--text);min-width:48px}.more{border:0;background:transparent;color:var(--muted);font-size:20px}
.week-grid{display:grid;grid-template-columns:repeat(7,minmax(120px,1fr));gap:8px;overflow:auto}.day-col{min-height:460px;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:10px}.day-head{font-size:13px;font-weight:700;padding:4px 3px 10px;border-bottom:1px solid var(--border);margin-bottom:8px}.day-head span{display:block;color:var(--muted);font-weight:500;margin-top:2px}.day-col.today{outline:2px solid var(--accent);outline-offset:-2px}.mini-task{padding:8px;border-radius:8px;margin-bottom:6px;font-size:12px;border-left:4px solid var(--accent);background:var(--accent-soft);cursor:pointer}.mini-task.done{opacity:.55;text-decoration:line-through}.mini-task .mt-time{font-weight:700}.calendar{background:var(--surface);border:1px solid var(--border);border-radius:14px;overflow:hidden}.cal-head{display:grid;grid-template-columns:repeat(7,1fr);border-bottom:1px solid var(--border)}.cal-head div{padding:10px;text-align:center;color:var(--muted);font-size:12px;font-weight:700}.cal-grid{display:grid;grid-template-columns:repeat(7,1fr)}.cal-cell{min-height:115px;border-right:1px solid var(--border);border-bottom:1px solid var(--border);padding:7px;overflow:hidden}.cal-cell:nth-child(7n){border-right:0}.cal-num{font-size:12px;color:var(--muted);margin-bottom:5px}.cal-cell.today .cal-num{display:inline-grid;place-items:center;background:var(--accent);color:#fff;width:25px;height:25px;border-radius:50%}.event{font-size:11px;padding:4px 5px;border-radius:5px;margin:3px 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;background:var(--accent-soft);color:var(--accent);cursor:pointer}.event.no-time{opacity:.8}.stats-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:18px}.stat{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:17px}.stat-label{color:var(--muted);font-size:12px}.stat-value{font-size:28px;font-weight:800;margin-top:5px}.bar-list{display:grid;gap:12px}.bar-item{display:grid;grid-template-columns:180px 1fr 45px;align-items:center;gap:10px;font-size:13px}.bar{height:9px;background:var(--surface2);border-radius:10px;overflow:hidden}.bar span{height:100%;display:block;background:var(--accent)}
.empty{padding:35px;text-align:center;color:var(--muted);background:var(--surface);border:1px dashed var(--border);border-radius:12px}
.modal-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:center;justify-content:center;padding:20px;z-index:30}.modal-backdrop.open{display:flex}.modal{width:min(560px,100%);max-height:90vh;overflow:auto;background:var(--surface);border-radius:18px;box-shadow:var(--shadow);padding:22px}.modal h2{margin:0 0 18px}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field{display:grid;gap:6px}.field.full{grid-column:1/-1}.field label{font-size:12px;color:var(--muted);font-weight:650}.field input,.field textarea,.field select{border:1px solid var(--border);background:var(--surface);color:var(--text);border-radius:9px;padding:10px;outline:none}.field textarea{min-height:80px;resize:vertical}.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}.danger{color:var(--danger);border-color:var(--border);background:transparent}
.profile{display:grid;gap:18px;max-width:700px}.settings-card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:18px}.settings-card h3{margin:0 0 14px}.theme-row{display:flex;gap:8px;flex-wrap:wrap}
.toast{position:fixed;right:22px;bottom:22px;background:var(--text);color:var(--surface);padding:11px 15px;border-radius:10px;display:none;z-index:50}.toast.show{display:block}
@media(max-width:900px){.sidebar{width:70px;padding:18px 8px}.logo{font-size:0}.logo span{font-size:22px}.nav button{justify-content:center;font-size:0}.nav button:first-letter{font-size:18px}.sidebar-bottom{left:8px;right:8px}.user-btn{justify-content:center}.user-info{display:none}.main{margin-left:70px;width:calc(100% - 70px);padding:20px}.stats-grid{grid-template-columns:repeat(2,1fr)}.week-grid{grid-template-columns:repeat(7,150px)}}
@media(max-width:600px){.main{padding:15px}.topbar{align-items:flex-start;gap:10px}.top-actions .secondary{display:none}.form-grid{grid-template-columns:1fr}.field.full{grid-column:auto}.stats-grid{grid-template-columns:1fr 1fr}.bar-item{grid-template-columns:100px 1fr 35px}}
</style>
</head>
<body>
<div class="app">
<aside class="sidebar">
  <div class="logo">Tarefas<span>.</span></div>
  <nav class="nav">
    <button data-view="today" class="active">🏠 <span>Hoje</span></button>
    <button data-view="week">📅 <span>Semana</span></button>
    <button data-view="calendar">🗓️ <span>Calendário</span></button>
    <button data-view="stats">📊 <span>Estatísticas</span></button>
  </nav>
  <div class="sidebar-bottom">
    <button class="bottom-action" id="newTaskSide">＋ <span>Nova tarefa</span></button>
    <div class="user-card"><button class="user-btn" id="profileBtn"><div class="avatar" id="avatar">V</div><div class="user-info"><strong id="userNameSide">Usuário</strong><small style="display:block;color:var(--muted)">Minha conta</small></div></button></div>
  </div>
</aside>

<main class="main">
  <div class="topbar">
    <div><div class="page-title" id="pageTitle">Hoje</div><div id="pageSubtitle" style="color:var(--muted);font-size:13px;margin-top:3px"></div></div>
    <div class="top-actions"><button class="secondary" id="filterBtn">🔎 Filtrar</button><button class="primary" id="newTask">＋ Nova tarefa</button></div>
  </div>
  <div id="content"></div>
</main>
</div>

<div class="modal-backdrop" id="taskModal">
 <div class="modal">
  <h2 id="modalTitle">Nova tarefa</h2>
  <form id="taskForm">
   <div class="form-grid">
    <div class="field full"><label>Tarefa *</label><input id="fTitle" required placeholder="Ex.: Estudar Cardiologia"></div>
    <div class="field"><label>Data *</label><input type="date" id="fDate" required></div>
    <div class="field"><label>Horário (opcional)</label><input type="time" id="fTime"></div>
    <div class="field"><label>Duração</label><select id="fDuration"><option value="">Sem duração</option><option value="15">15 min</option><option value="30">30 min</option><option value="45">45 min</option><option value="60">1 hora</option><option value="90">1h30</option><option value="120">2 horas</option><option value="180">3 horas</option><option value="240">4 horas</option></select></div>
    <div class="field"><label>Categoria</label><select id="fCategory"></select></div>
    <div class="field full"><label>Descrição</label><textarea id="fDescription" placeholder="Detalhes da tarefa (opcional)"></textarea></div>
   </div>
   <div class="modal-actions"><button type="button" class="secondary" id="cancelModal">Cancelar</button><button type="submit" class="primary">Salvar tarefa</button></div>
  </form>
 </div>
</div>

<div class="modal-backdrop" id="detailModal">
 <div class="modal"><h2 id="detailTitle"></h2><div id="detailBody"></div><div class="modal-actions"><button class="danger" id="deleteDetail">Excluir</button><button class="secondary" id="duplicateDetail">Duplicar</button><button class="primary" id="editDetail">Editar</button></div></div>
</div>

<div class="modal-backdrop" id="profileModal">
 <div class="modal"><h2>Minha conta</h2>
  <div class="profile">
   <div class="settings-card"><h3>Perfil</h3><div class="field"><label>Nome de usuário</label><input id="profileName"></div><div class="modal-actions"><button class="primary" id="saveProfile">Salvar nome</button></div></div>
   <div class="settings-card"><h3>Aparência</h3><div class="theme-row"><button class="secondary themeBtn" data-theme-choice="light">☀️ Claro</button><button class="secondary themeBtn" data-theme-choice="dark">🌙 Escuro</button><button class="secondary themeBtn" data-theme-choice="system">💻 Sistema</button></div></div>
   <div class="settings-card"><h3>Senha</h3><p style="color:var(--muted);font-size:13px">Nesta versão local, a autenticação ainda não está conectada a um servidor. A estrutura de configurações já está preparada.</p></div>
  </div>
  <div class="modal-actions"><button class="secondary" id="closeProfile">Fechar</button></div>
 </div>
</div>

<div class="toast" id="toast"></div>

<script>
const cats={
 study:{label:"📚 Estudo / Desenvolvimento",color:"#4f46e5"},
 health:{label:"🏋️ Saúde / Exercício",color:"#16a34a"},
 leisure:{label:"🎾 Lazer / Hobbies",color:"#9333ea"},
 social:{label:"👥 Social",color:"#db2777"},
 home:{label:"🏠 Casa / Vida doméstica",color:"#ea580c"},
 work:{label:"💼 Trabalho / Obrigações",color:"#2563eb"},
 shopping:{label:"🛍️ Compras / Pendências",color:"#ca8a04"},
 selfcare:{label:"🧼 Autocuidado",color:"#0891b2"}
};
const todayISO=()=>new Date().toISOString().slice(0,10);
let tasks=JSON.parse(localStorage.getItem("tarefas_tasks")||"null")||[
 {id:1,title:"Estudar Cardiologia",date:todayISO(),time:"13:00",duration:60,category:"study",description:"Revisar insuficiência cardíaca e ECG.",completed:false},
 {id:2,title:"Treino",date:todayISO(),time:"18:00",duration:60,category:"health",description:"Treino de musculação.",completed:false},
 {id:3,title:"Organizar quarto",date:todayISO(),time:"",duration:"",category:"home",description:"",completed:true},
 {id:4,title:"Comprar material",date:todayISO(),time:"",duration:"",category:"shopping",description:"",completed:false}
];
let state={view:"today",filter:"all",editing:null,detail:null,weekOffset:0,monthOffset:0,statsPeriod:"week",statsStart:"",statsEnd:"",statsCategory:"all"};
const save=()=>localStorage.setItem("tarefas_tasks",JSON.stringify(tasks));
const pad=n=>String(n).padStart(2,"0");
const iso=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parseISO=s=>{const [y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d)};
const fmtDate=s=>parseISO(s).toLocaleDateString("pt-BR",{day:"2-digit",month:"2-digit",year:"numeric"});
const weekday=d=>d.toLocaleDateString("pt-BR",{weekday:"short"}).replace(".","");
const durationLabel=m=>m? (m>=60?`${Math.floor(m/60)}h${m%60?String(m%60).padStart(2,"0"):""}`:`${m} min`):"";
function filtered(arr){return state.filter==="all"?arr:arr.filter(t=>t.category===state.filter)}
function progressFor(arr){let total=arr.length,done=arr.filter(t=>t.completed).length;return {total,done,pct:total?Math.round(done/total*100):0}}
function taskCard(t){
 const c=cats[t.category]; return `<div class="task ${t.completed?"done":""}" data-id="${t.id}">
  <button class="check ${t.completed?"done":""}" data-check="${t.id}">${t.completed?"✓":""}</button>
  ${t.time?`<div class="task-time">${t.time}</div>`:""}
  <div class="task-main"><div class="task-title">${esc(t.title)}</div><div class="task-meta"><span><i class="cat-dot" style="background:${c.color}"></i> ${c.label}</span>${t.duration?`<span>· ${durationLabel(t.duration)}</span>`:""}</div></div>
  <button class="more" data-detail="${t.id}">⋮</button>
 </div>`;
}
function progressCard(arr,label){const p=progressFor(arr);return `<div class="progress-card"><div class="progress-row"><strong>${label}</strong><span>${p.done}/${p.total} concluídas · ${p.pct}%</span></div><div class="progress"><span style="width:${p.pct}%"></span></div></div>`}
function renderToday(){
 const d=new Date(); const ds=iso(d); const arr=filtered(tasks.filter(t=>t.date===ds).sort((a,b)=>(a.time||"99:99").localeCompare(b.time||"99:99")));
 const timed=arr.filter(t=>t.time), no=arr.filter(t=>!t.time);
 return progressCard(arr,"Progresso de hoje")+`<div class="filters">${filterChips()}</div>
 <section class="task-section"><div class="section-head"><h3>Com horário</h3></div><div class="task-list">${timed.length?timed.map(taskCard).join(""):`<div class="empty">Nenhuma tarefa com horário para hoje.</div>`}</div></section>
 <section class="task-section"><div class="section-head"><h3>Sem horário</h3></div><div class="task-list">${no.length?no.map(taskCard).join(""):`<div class="empty">Nenhuma tarefa sem horário para hoje.</div>`}</div></section>`;
}
function filterChips(){return `<button class="chip ${state.filter==="all"?"active":""}" data-filter="all">Todas</button>`+Object.entries(cats).map(([k,c])=>`<button class="chip ${state.filter===k?"active":""}" data-filter="${k}">${c.label}</button>`).join("")}
function getMonday(base){const d=new Date(base);const day=d.getDay();const diff=(day+6)%7;d.setDate(d.getDate()-diff);return d}
function renderWeek(){
 const base=getMonday(new Date());base.setDate(base.getDate()+state.weekOffset*7);
 const days=Array.from({length:7},(_,i)=>{let d=new Date(base);d.setDate(base.getDate()+i);return d});
 const start=fmtDate(iso(days[0])),end=fmtDate(iso(days[6]));
 return `<div class="filters"><button class="secondary" id="prevWeek">‹</button><button class="secondary" id="todayWeek">Hoje</button><button class="secondary" id="nextWeek">›</button></div><div class="week-grid">${days.map(d=>{
   const ds=iso(d), arr=filtered(tasks.filter(t=>t.date===ds).sort((a,b)=>(a.time||"99:99").localeCompare(b.time||"99:99"))),p=progressFor(arr);
   return `<div class="day-col ${ds===todayISO()?"today":""}"><div class="day-head">${d.toLocaleDateString("pt-BR",{weekday:"long"})}<span>${d.toLocaleDateString("pt-BR",{day:"2-digit",month:"2-digit"})} · ${p.done}/${p.total}</span></div>${arr.length?arr.map(t=>`<div class="mini-task ${t.completed?"done":""}" style="border-left-color:${cats[t.category].color}" data-detail="${t.id}">${t.time?`<div class="mt-time">${t.time}${t.duration?`–${addMinutes(t.time,t.duration)}`:""}</div>`:""}${esc(t.title)}</div>`).join(""):`<div style="font-size:12px;color:var(--muted);padding:12px 3px">Sem tarefas</div>`}</div>`;
 }).join("")}</div>`;
}
function addMinutes(time,m){let [h,min]=time.split(":").map(Number);let x=h*60+min+m;return `${pad(Math.floor(x/60)%24)}:${pad(x%60)}`}
function renderCalendar(){
 const now=new Date();const month=new Date(now.getFullYear(),now.getMonth()+state.monthOffset,1);const y=month.getFullYear(),m=month.getMonth();
 const first=new Date(y,m,1),start=(first.getDay()+6)%7,days=new Date(y,m+1,0).getDate(),total=Math.ceil((start+days)/7)*7;
 let cells="";
 for(let i=0;i<total;i++){const n=i-start+1;if(n<1||n>days){cells+=`<div class="cal-cell"></div>`;continue}
  const d=new Date(y,m,n),ds=iso(d),arr=filtered(tasks.filter(t=>t.date===ds).sort((a,b)=>(a.time||"99:99").localeCompare(b.time||"99:99")));
  cells+=`<div class="cal-cell ${ds===todayISO()?"today":""}" data-date="${ds}"><div class="cal-num">${n}</div>${arr.slice(0,4).map(t=>`<div class="event ${!t.time?"no-time":""}" style="color:${cats[t.category].color};background:${cats[t.category].color}18" data-detail="${t.id}">${t.time?`${t.time} · `:""}${esc(t.title)}</div>`).join("")}${arr.length>4?`<div style="font-size:10px;color:var(--muted)">+${arr.length-4} tarefas</div>`:""}</div>`;
 }
 return `<div class="filters"><button class="secondary" id="prevMonth">‹</button><button class="secondary" id="monthToday">Hoje</button><button class="secondary" id="nextMonth">›</button><strong style="padding:9px">${month.toLocaleDateString("pt-BR",{month:"long",year:"numeric"})}</strong></div>
 <div class="calendar"><div class="cal-head">${["Seg","Ter","Qua","Qui","Sex","Sáb","Dom"].map(x=>`<div>${x}</div>`).join("")}</div><div class="cal-grid">${cells}</div></div>`;
}
function statsRange(){
 const now=new Date();
 if(state.statsPeriod==="week"){
   const start=getMonday(now), end=new Date(start); end.setDate(start.getDate()+6);
   return {start:iso(start),end:iso(end),label:`${fmtDate(iso(start))} – ${fmtDate(iso(end))}`};
 }
 if(state.statsPeriod==="month"){
   const start=new Date(now.getFullYear(),now.getMonth(),1), end=new Date(now.getFullYear(),now.getMonth()+1,0);
   return {start:iso(start),end:iso(end),label:now.toLocaleDateString("pt-BR",{month:"long",year:"numeric"})};
 }
 if(state.statsPeriod==="year"){
   const start=new Date(now.getFullYear(),0,1), end=new Date(now.getFullYear(),11,31);
   return {start:iso(start),end:iso(end),label:String(now.getFullYear())};
 }
 const start=state.statsStart||todayISO(), end=state.statsEnd||start;
 return {start:start<=end?start:end,end:start<=end?end:start,label:`${fmtDate(start<=end?start:end)} – ${fmtDate(start<=end?end:start)}`};
}
function renderStats(){
 const range=statsRange();
 let all=tasks.filter(t=>t.date>=range.start && t.date<=range.end);
 if(state.statsCategory!=="all") all=all.filter(t=>t.category===state.statsCategory);
 const p=progressFor(all);
 const by=Object.entries(cats).map(([k,c])=>{
   const a=all.filter(t=>t.category===k),q=progressFor(a);
   return {c,a,q};
 }).filter(x=>x.a.length);
 const periodBtn=(key,label)=>`<button class="chip ${state.statsPeriod===key?"active":""}" data-stats-period="${key}">${label}</button>`;
 const categoryButtons=`<div class="filters" style="margin-top:10px"><strong style="font-size:12px;color:var(--muted);padding:8px 2px">Categoria:</strong><button class="chip ${state.statsCategory==="all"?"active":""}" data-stats-category="all">Todas</button>${Object.entries(cats).map(([k,c])=>`<button class="chip ${state.statsCategory===k?"active":""}" data-stats-category="${k}">${c.label}</button>`).join("")}</div>`;
 const custom=state.statsPeriod==="custom"?`<div class="settings-card" style="margin-bottom:18px"><div class="form-grid"><div class="field"><label>Data inicial</label><input type="date" id="statsStart" value="${state.statsStart||todayISO()}"></div><div class="field"><label>Data final</label><input type="date" id="statsEnd" value="${state.statsEnd||todayISO()}"></div></div><div class="modal-actions"><button class="primary" id="applyStatsRange">Aplicar período</button></div></div>`:"";
 return `<div class="filters">${periodBtn("week","Semana")}${periodBtn("month","Mês")}${periodBtn("year","Ano")}${periodBtn("custom","Personalizado")}<span style="font-size:12px;color:var(--muted);padding:8px">${esc(range.label)}</span></div>
 ${custom}${categoryButtons}
 <div class="stats-grid"><div class="stat"><div class="stat-label">Taxa de conclusão</div><div class="stat-value">${p.pct}%</div></div><div class="stat"><div class="stat-label">Planejadas</div><div class="stat-value">${p.total}</div></div><div class="stat"><div class="stat-label">Concluídas</div><div class="stat-value">${p.done}</div></div><div class="stat"><div class="stat-label">Pendentes</div><div class="stat-value">${p.total-p.done}</div></div></div>
 <div class="settings-card"><h3>Conclusão por categoria</h3><div class="bar-list">${by.map(x=>`<div class="bar-item"><span>${x.c.label}</span><div class="bar"><span style="width:${x.q.pct}%;background:${x.c.color}"></span></div><strong>${x.q.pct}%</strong></div>`).join("")||`<div class="empty">Não há tarefas no período selecionado.</div>`}</div></div>`;
}
function render(){
 const titles={today:"Hoje",week:"Semana",calendar:"Calendário",stats:"Estatísticas"};document.getElementById("pageTitle").textContent=titles[state.view];
 document.getElementById("pageSubtitle").textContent=state.view==="today"?new Date().toLocaleDateString("pt-BR",{weekday:"long",day:"numeric",month:"long"}):"";
 const content=document.getElementById("content");content.innerHTML=state.view==="today"?renderToday():state.view==="week"?renderWeek():state.view==="calendar"?renderCalendar():renderStats();
 document.querySelectorAll(".nav button").forEach(b=>b.classList.toggle("active",b.dataset.view===state.view));
 bindDynamic();
}
function bindDynamic(){
 document.querySelectorAll("[data-check]").forEach(b=>b.onclick=e=>{e.stopPropagation();const t=tasks.find(x=>x.id==b.dataset.check);t.completed=!t.completed;save();toast(t.completed?"Tarefa concluída ✓":"Tarefa reaberta");render()});
 document.querySelectorAll("[data-detail]").forEach(el=>el.onclick=e=>{openDetail(Number(el.dataset.detail))});
 document.querySelectorAll("[data-filter]").forEach(el=>el.onclick=()=>{state.filter=el.dataset.filter;render()});
 document.querySelectorAll("[data-stats-period]").forEach(el=>el.onclick=()=>{
   state.statsPeriod=el.dataset.statsPeriod;
   if(state.statsPeriod==="custom" && (!state.statsStart || !state.statsEnd)){state.statsStart=todayISO();state.statsEnd=todayISO();}
   render();
 });
 document.querySelectorAll("[data-stats-category]").forEach(el=>el.onclick=()=>{state.statsCategory=el.dataset.statsCategory;render()});
 document.getElementById("applyStatsRange")?.addEventListener("click",()=>{
   state.statsStart=document.getElementById("statsStart").value;
   state.statsEnd=document.getElementById("statsEnd").value;
   if(!state.statsStart || !state.statsEnd){toast("Escolha as duas datas.");return}
   state.statsPeriod="custom"; render(); toast("Período atualizado");
 });
 document.getElementById("prevWeek")?.addEventListener("click",()=>{state.weekOffset--;render()});document.getElementById("nextWeek")?.addEventListener("click",()=>{state.weekOffset++;render()});document.getElementById("todayWeek")?.addEventListener("click",()=>{state.weekOffset=0;render()});
 document.getElementById("prevMonth")?.addEventListener("click",()=>{state.monthOffset--;render()});document.getElementById("nextMonth")?.addEventListener("click",()=>{state.monthOffset++;render()});document.getElementById("monthToday")?.addEventListener("click",()=>{state.monthOffset=0;render()});
 document.querySelectorAll(".cal-cell[data-date]").forEach(c=>c.addEventListener("dblclick",()=>openNew(c.dataset.date)));
}
function openNew(date=todayISO()){
 state.editing=null;document.getElementById("modalTitle").textContent="Nova tarefa";document.getElementById("taskForm").reset();document.getElementById("fDate").value=date;document.getElementById("fCategory").value="study";document.getElementById("taskModal").classList.add("open");
}
function openEdit(id){const t=tasks.find(x=>x.id===id);state.editing=id;document.getElementById("modalTitle").textContent="Editar tarefa";fTitle.value=t.title;fDate.value=t.date;fTime.value=t.time||"";fDuration.value=t.duration||"";fCategory.value=t.category;fDescription.value=t.description||"";document.getElementById("taskModal").classList.add("open")}
function openDetail(id){const t=tasks.find(x=>x.id===id);state.detail=id;const c=cats[t.category];detailTitle.textContent=t.title;detailBody.innerHTML=`<div style="display:grid;gap:12px"><div><strong>Data</strong><br><span style="color:var(--muted)">${fmtDate(t.date)}</span></div><div><strong>Horário</strong><br><span style="color:var(--muted)">${t.time||"Sem horário"}</span></div><div><strong>Duração</strong><br><span style="color:var(--muted)">${durationLabel(t.duration)||"Não definida"}</span></div><div><strong>Categoria</strong><br><span style="color:${c.color}">${c.label}</span></div>${t.description?`<div><strong>Descrição</strong><br><span style="color:var(--muted)">${esc(t.description)}</span></div>`:""}<div><strong>Status</strong><br><span style="color:var(--muted)">${t.completed?"Concluída ✓":"Pendente"}</span></div></div>`;detailModal.classList.add("open")}
function esc(s){return String(s||"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
function toast(msg){const x=document.getElementById("toast");x.textContent=msg;x.classList.add("show");setTimeout(()=>x.classList.remove("show"),1800)}
Object.entries(cats).forEach(([k,c])=>fCategory.insertAdjacentHTML("beforeend",`<option value="${k}">${c.label}</option>`));
document.querySelectorAll(".nav button").forEach(b=>b.addEventListener("click",()=>{state.view=b.dataset.view;render()}));
newTask.onclick=()=>openNew();newTaskSide.onclick=()=>openNew();cancelModal.onclick=()=>taskModal.classList.remove("open");
taskForm.onsubmit=e=>{e.preventDefault();const data={title:fTitle.value.trim(),date:fDate.value,time:fTime.value,duration:fDuration.value?Number(fDuration.value):"",category:fCategory.value,description:fDescription.value.trim()};
 if(state.editing){Object.assign(tasks.find(x=>x.id===state.editing),data);toast("Tarefa atualizada")}else{tasks.push({id:Date.now(),...data,completed:false});toast("Tarefa criada")}
 save();taskModal.classList.remove("open");render()};
editDetail.onclick=()=>{detailModal.classList.remove("open");openEdit(state.detail)};
deleteDetail.onclick=()=>{if(confirm("Excluir esta tarefa?")){tasks=tasks.filter(x=>x.id!==state.detail);save();detailModal.classList.remove("open");toast("Tarefa excluída");render()}};
duplicateDetail.onclick=()=>{const t=tasks.find(x=>x.id===state.detail);detailModal.classList.remove("open");openNew(t.date);fTitle.value=t.title;fTime.value=t.time||"";fDuration.value=t.duration||"";fCategory.value=t.category;fDescription.value=t.description||"";toast("Escolha a nova data da duplicata")};
[taskModal,detailModal,profileModal].forEach(m=>m.addEventListener("click",e=>{if(e.target===m)m.classList.remove("open")}));
profileBtn.onclick=()=>{profileName.value=localStorage.getItem("tarefas_name")||"Usuário";profileModal.classList.add("open")};
closeProfile.onclick=()=>profileModal.classList.remove("open");saveProfile.onclick=()=>{const n=profileName.value.trim()||"Usuário";localStorage.setItem("tarefas_name",n);userNameSide.textContent=n;avatar.textContent=n[0].toUpperCase();profileModal.classList.remove("open");toast("Perfil atualizado")};
document.querySelectorAll(".themeBtn").forEach(b=>b.onclick=()=>setTheme(b.dataset.themeChoice));
function setTheme(v){localStorage.setItem("tarefas_theme",v);applyTheme();toast("Aparência atualizada")}
function applyTheme(){let v=localStorage.getItem("tarefas_theme")||"system";let dark=v==="dark"||(v==="system"&&matchMedia("(prefers-color-scheme: dark)").matches);document.documentElement.dataset.theme=dark?"dark":"light"}
filterBtn.onclick=()=>{if(state.view==="today")document.querySelector(".filters")?.scrollIntoView({behavior:"smooth"});else toast("Use os filtros disponíveis nesta visão")};
userNameSide.textContent=localStorage.getItem("tarefas_name")||"Usuário";avatar.textContent=(localStorage.getItem("tarefas_name")||"Usuário")[0].toUpperCase();applyTheme();render();
</script>
</body>
</html>
