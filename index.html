<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tarefas</title>
<style>
:root{--bg:#f4f7f5;--card:#fff;--text:#18231d;--muted:#718078;--line:#dfe7e2;--green:#48a36b;--green2:#b8e8c7;--soft:#eaf7ee;--danger:#c75d5d}
*{box-sizing:border-box}body{margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--text)}
button,input,select,textarea{font:inherit}button{cursor:pointer}
aside{position:fixed;inset:0 auto 0 0;width:250px;background:var(--card);border-right:1px solid var(--line);padding:18px 13px;transition:.22s;z-index:4}
aside.collapsed{width:72px}.logo{font-size:23px;font-weight:850;padding:5px 12px 25px}.logo b{color:var(--green)}
nav button,.bottom button{display:flex;align-items:center;gap:12px;width:100%;border:0;background:transparent;color:var(--muted);padding:11px 13px;border-radius:11px;margin:3px 0;text-align:left}
nav button.active,nav button:hover,.bottom button:hover{background:var(--soft);color:var(--green)}
aside.collapsed span,aside.collapsed .usertext{display:none}aside.collapsed nav button,aside.collapsed .bottom button{justify-content:center}
.bottom{position:absolute;bottom:14px;left:13px;right:13px}.user{border-top:1px solid var(--line);padding-top:9px}
.avatar{width:35px;height:35px;border-radius:50%;background:var(--green);color:#fff;display:grid;place-items:center;font-weight:800;flex:none}
main{margin-left:250px;padding:28px 34px;transition:.22s;min-height:100vh}aside.collapsed~main{margin-left:72px}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}.top h1{margin:0;font-size:29px}.sub{color:var(--muted);font-size:13px;margin-top:4px}.actions{display:flex;gap:8px}
.btn{border:1px solid var(--line);background:var(--card);padding:9px 12px;border-radius:10px;color:var(--text)}.btn:hover{border-color:#b8c9be}.primary{background:var(--green);color:#fff;border-color:var(--green);font-weight:700}
.welcome{padding:21px;margin-bottom:16px;background:linear-gradient(135deg,#fff,var(--soft));border:1px solid var(--line);border-radius:17px}
.grid{display:grid;grid-template-columns:minmax(0,1fr) 310px;gap:16px}.card,.task,.day,.calendar{background:var(--card);border:1px solid var(--line);border-radius:16px}.card{padding:17px}
.weather{min-height:160px}.weather strong{font-size:37px}.progress{height:9px;background:#edf1ee;border-radius:9px;overflow:hidden}.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--green2),var(--green))}
.task{display:flex;align-items:center;gap:11px;padding:13px;margin:8px 0;cursor:pointer}.check{width:21px;height:21px;border:1.5px solid #aab7af;border-radius:50%;display:grid;place-items:center;background:none;flex:none}.check.done{background:#55b879;color:#fff;border-color:#55b879}.task.done .title{text-decoration:line-through;color:var(--muted)}
.taskbody{flex:1}.meta{font-size:12px;color:var(--muted);margin-top:4px}.dot{display:inline-block;width:8px;height:8px;border-radius:50%}
.week{display:grid;grid-template-columns:repeat(7,minmax(120px,1fr));gap:8px;overflow:auto}.day{padding:10px;min-height:450px}.day.today{box-shadow:inset 0 3px var(--green)}.day h3{font-size:13px;margin:0 0 10px;border-bottom:1px solid var(--line);padding-bottom:9px}.day h3 small{display:block;color:var(--muted);font-weight:500;margin-top:3px}.mini{font-size:12px;padding:8px;border-left:4px solid var(--green);background:var(--soft);border-radius:7px;margin:5px 0;cursor:pointer}
.calhead,.calgrid{display:grid;grid-template-columns:repeat(7,1fr)}.calhead div{text-align:center;padding:10px;color:var(--muted);font-size:12px;font-weight:700}.calgrid{background:var(--line);gap:1px}.cell{background:var(--card);min-height:120px;padding:7px}.num{font-size:12px;color:var(--muted)}.cell.today .num{display:inline-grid;place-items:center;width:25px;height:25px;background:var(--green);color:#fff;border-radius:50%}.event{font-size:11px;padding:4px 5px;border-radius:6px;background:var(--soft);color:var(--green);margin:3px 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px}.stat small{color:var(--muted)}.stat strong{display:block;font-size:28px;margin-top:5px}
.notes{display:grid;grid-template-columns:repeat(5,minmax(170px,1fr));gap:12px}.note{background:#fffef3;border:1px solid #ece7c7;border-radius:14px;padding:13px;min-height:150px}.note h3{margin:0 0 10px;font-size:14px}.noteitem{font-size:13px;margin:7px 0}
.modalbg{position:fixed;inset:0;background:#0007;display:none;align-items:center;justify-content:center;padding:20px;z-index:10}.modalbg.open{display:flex}.modal{width:min(680px,100%);max-height:90vh;overflow:auto;background:var(--card);border-radius:18px;padding:22px}.form{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field{display:grid;gap:6px}.field.full{grid-column:1/-1}.field label{font-size:12px;color:var(--muted);font-weight:700}.field input,.field select,.field textarea{padding:10px;border:1px solid var(--line);border-radius:9px;background:var(--card);color:var(--text)}textarea{min-height:80px}.modalfoot{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}.subtask{display:flex;gap:7px;margin:6px 0}.subtask input[type=text]{flex:1}.catrow{display:flex;gap:7px;margin:7px 0}.catrow input[type=text]{flex:1}.toast{position:fixed;right:20px;bottom:20px;background:var(--text);color:#fff;padding:10px 14px;border-radius:9px;display:none;z-index:20}.toast.show{display:block}
@media(max-width:900px){.grid{grid-template-columns:1fr}.notes{grid-template-columns:repeat(2,1fr)}.stats{grid-template-columns:repeat(2,1fr)}}@media(max-width:650px){aside{width:72px}aside span,aside .usertext{display:none}aside nav button,aside .bottom button{justify-content:center}main{margin-left:72px;padding:18px}.form{grid-template-columns:1fr}.field.full{grid-column:auto}.notes{grid-template-columns:1fr}}
</style>
</head>
<body>
<aside id="side">
<div class="logo">✓ <span>Tarefas<b>.</b></span></div>
<nav>
<button class="active" data-view="today">⌂ <span>Hoje</span></button>
<button data-view="week">▦ <span>Semana</span></button>
<button data-view="calendar">□ <span>Calendário</span></button>
<button data-view="stats">◔ <span>Estatísticas</span></button>
<button data-view="notes">▤ <span>Anotações</span></button>
</nav>
<div class="bottom">
<button id="newSide">＋ <span>Nova tarefa</span></button>
<button id="profile"><i class="avatar">U</i><span class="usertext" id="sideName">Usuário</span></button>
</div>
</aside>

<main>
<div class="top"><div><h1 id="title">Hoje</h1><div class="sub" id="subtitle"></div></div><div class="actions"><button class="btn" id="collapse">☰</button><button class="btn" id="filter">Filtrar</button><button class="btn primary" id="new">＋ Nova tarefa</button></div></div>
<div id="content"></div>
</main>

<div class="modalbg" id="taskModal"><div class="modal">
<h2 id="mtitle">Nova tarefa</h2>
<form id="form"><div class="form">
<div class="field full"><label>Tarefa *</label><input id="name" required></div>
<div class="field"><label>Data *</label><input type="date" id="date" required></div>
<div class="field"><label>Horário (opcional)</label><input type="time" id="time"></div>
<div class="field"><label>Tempo necessário</label><select id="duration"><option value="">Sem duração</option><option value="15">15 min</option><option value="30">30 min</option><option value="60">1 hora</option><option value="90">1h30</option><option value="120">2 horas</option><option value="180">3 horas</option><option value="240">4 horas</option></select></div>
<div class="field"><label>Categoria</label><select id="category"></select></div>
<div class="field"><label>Lembrete</label><select id="reminder"><option value="">Sem lembrete</option><option value="0">No horário</option><option value="5">5 minutos antes</option><option value="10">10 minutos antes</option><option value="15">15 minutos antes</option><option value="30">30 minutos antes</option><option value="60">1 hora antes</option></select></div>
<div class="field full"><label>Descrição</label><textarea id="desc"></textarea></div>
<div class="field full"><label>Subtarefas</label><div id="subs"></div><button type="button" class="btn" id="addSub">＋ Adicionar subtarefa</button></div>
</div><div class="modalfoot"><button type="button" class="btn" id="cancel">Cancelar</button><button class="btn primary">Salvar</button></div></form>
</div></div>

<div class="modalbg" id="settingsModal"><div class="modal"><h2>Configurações</h2>
<div class="card"><h3>Perfil</h3><div class="field"><label>Nome</label><input id="username"></div><div class="modalfoot"><button class="btn primary" id="saveName">Salvar</button></div></div>
<div class="card" style="margin-top:12px"><h3>Aparência</h3><button class="btn" data-theme="light">Claro</button> <button class="btn" data-theme="dark">Escuro</button> <button class="btn" data-theme="system">Sistema</button></div>
<div class="card" style="margin-top:12px"><h3>Primeiro dia da semana</h3><select id="weekstart"><option value="0">Domingo</option><option value="1">Segunda-feira</option><option value="2">Terça-feira</option><option value="3">Quarta-feira</option><option value="4">Quinta-feira</option><option value="5">Sexta-feira</option><option value="6">Sábado</option></select></div>
<div class="card" style="margin-top:12px"><h3>Categorias</h3><div id="cats"></div><button class="btn" id="addCat">＋ Adicionar categoria</button></div>
<div class="modalfoot"><button class="btn" id="closeSettings">Fechar</button></div>
</div></div>

<div class="modalbg" id="detailModal"><div class="modal"><h2 id="detailTitle"></h2><div id="detail"></div><div class="modalfoot"><button class="btn" id="duplicate">Duplicar</button><button class="btn" id="edit">Editar</button><button class="btn" id="delete">Excluir</button></div></div></div>
<div class="toast" id="toast"></div>

<script>
const defaults={study:["Estudo / Desenvolvimento","#4f8f63"],health:["Saúde / Exercício","#58a86d"],leisure:["Lazer / Hobbies","#7d9a88"],social:["Social","#c47b62"],home:["Casa / Vida doméstica","#b48b5a"],work:["Trabalho / Obrigações","#6287a8"],shopping:["Compras / Pendências","#aa8b52"],self:["Autocuidado","#6a9c9c"]};
let cats=JSON.parse(localStorage.getItem("cats")||"null")||Object.fromEntries(Object.entries(defaults).map(([k,v])=>[k,{label:v[0],color:v[1]}]));
let tasks=JSON.parse(localStorage.getItem("tasks")||"[]"),notes=JSON.parse(localStorage.getItem("notes")||"[]"),view="today",editing=null,detailId=null,woff=0,moff=0;
const $=id=>document.getElementById(id), save=()=>{localStorage.setItem("tasks",JSON.stringify(tasks));localStorage.setItem("cats",JSON.stringify(cats));localStorage.setItem("notes",JSON.stringify(notes))};
const pad=n=>String(n).padStart(2,"0"), today=()=>{let d=new Date();return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`}, iso=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
function esc(s){return String(s||"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]))}
function catOptions(){return Object.entries(cats).map(([k,c])=>`<option value="${k}">${esc(c.label)}</option>`).join("")}
function taskHTML(t){let c=cats[t.category]||{label:"Sem categoria",color:"#718078"},subs=t.subtasks||[],done=subs.filter(s=>s.done).length;return `<div class="task ${t.completed?"done":""}" data-id="${t.id}"><button class="check ${t.completed?"done":""}" data-check="${t.id}">${t.completed?"✓":""}</button>${t.time?`<strong>${t.time}</strong>`:""}<div class="taskbody"><div class="title">${esc(t.title)}</div><div class="meta"><i class="dot" style="background:${c.color}"></i> ${esc(c.label)} ${t.duration?"· "+t.duration+" min":""} ${subs.length?"· "+done+"/"+subs.length+" subtarefas":""}</div></div></div>`}
function prog(a){let d=a.filter(t=>t.completed).length;return [a.length,d,a.length?Math.round(d/a.length*100):0]}
function todayView(){let a=tasks.filter(t=>t.date===today()).sort((a,b)=>(a.time||"99").localeCompare(b.time||"99")),p=prog(a),n=localStorage.getItem("name")||"Usuário";return `<div class="welcome"><h2>Bem-vindo, ${esc(n)}</h2><div class="sub">Suas tarefas para hoje · ${new Date().toLocaleDateString("pt-BR",{weekday:"long",day:"numeric",month:"long"})}</div></div><div class="grid"><div><div class="card" style="margin-bottom:12px"><div style="display:flex;justify-content:space-between;margin-bottom:8px"><b>Progresso de hoje</b><span>${p[1]}/${p[0]} · ${p[2]}%</span></div><div class="progress"><i style="width:${p[2]}%"></i></div></div>${a.map(taskHTML).join("")||'<div class="card">Nenhuma tarefa para hoje.</div>'}</div><div class="card weather" id="weather"><h3>Clima</h3><strong>…</strong><div class="sub">Obtendo sua localização</div></div></div>`}
function weekView(){let d=new Date(),ws=+(localStorage.getItem("weekstart")||0),diff=(d.getDay()-ws+7)%7;d.setDate(d.getDate()-diff+woff*7);let days=Array.from({length:7},(_,i)=>{let x=new Date(d);x.setDate(d.getDate()+i);return x});return `<div style="margin-bottom:12px"><button class=btn id=pw>‹</button> <button class=btn id=tw>Hoje</button> <button class=btn id=nw>›</button></div><div class=week>${days.map(x=>{let a=tasks.filter(t=>t.date===iso(x));return `<div class="day ${iso(x)===today()?"today":""}"><h3>${x.toLocaleDateString("pt-BR",{weekday:"long"})}<small>${x.toLocaleDateString("pt-BR",{day:"2-digit",month:"2-digit"})}</small></h3>${a.map(t=>`<div class=mini data-id="${t.id}">${t.time?`<b>${t.time}</b> · `:""}${esc(t.title)}</div>`).join("")||'<span class=sub>Sem tarefas</span>'}</div>`}).join("")}</div>`}
function calendarView(){let base=new Date();base.setMonth(base.getMonth()+moff);let y=base.getFullYear(),m=base.getMonth(),first=new Date(y,m,1),ws=+(localStorage.getItem("weekstart")||0),start=(first.getDay()-ws+7)%7,last=new Date(y,m+1,0).getDate(),total=Math.ceil((start+last)/7)*7,cells="",names=["Dom","Seg","Ter","Qua","Qui","Sex","Sáb"];for(let i=0;i<total;i++){let n=i-start+1;if(n<1||n>last){cells+="<div class=cell></div>";continue}let ds=iso(new Date(y,m,n)),a=tasks.filter(t=>t.date===ds);cells+=`<div class="cell ${ds===today()?"today":""}" data-date="${ds}"><div class=num>${n}</div>${a.slice(0,5).map(t=>`<div class=event data-id="${t.id}">${t.time?t.time+" · ":""}${esc(t.title)}</div>`).join("")}</div>`}return `<div style="margin-bottom:12px"><button class=btn id=pm>‹</button> <button class=btn id=tm>Hoje</button> <button class=btn id=nm>›</button> <b style="margin-left:10px">${base.toLocaleDateString("pt-BR",{month:"long",year:"numeric"})}</b></div><div class=calendar><div class=calhead>${Array.from({length:7},(_,i)=>`<div>${names[(ws+i)%7]}</div>`).join("")}</div><div class=calgrid>${cells}</div></div>`}
function statsView(){let p=prog(tasks);return `<div class=stats><div class=stat><small>Conclusão</small><strong>${p[2]}%</strong></div><div class=stat><small>Planejadas</small><strong>${p[0]}</strong></div><div class=stat><small>Concluídas</small><strong>${p[1]}</strong></div><div class=stat><small>Pendentes</small><strong>${p[0]-p[1]}</strong></div></div><div class=card style="margin-top:16px"><h3>Conclusão por categoria</h3>${Object.entries(cats).map(([k,c])=>{let a=tasks.filter(t=>t.category===k),p=prog(a);return a.length?`<div style="margin:12px 0"><div style="display:flex;justify-content:space-between;font-size:13px"><span>${esc(c.label)}</span><b>${p[2]}%</b></div><div class=progress><i style="width:${p[2]}%"></i></div></div>`:""}).join("")}</div>`}
function notesView(){if(!notes.length)notes=[{id:Date.now(),title:"Ideias e pendências",items:[]}];return `<button class="btn primary" id=addNote>＋ Novo bloco</button><div class=notes style="margin-top:12px">${notes.map(n=>`<div class=note><h3>${esc(n.title)}</h3>${n.items.map((x,i)=>`<div class=noteitem><input type=checkbox data-note="${n.id}:${i}" ${x.done?"checked":""}> ${esc(x.text)}</div>`).join("")}<button class=btn data-addnote="${n.id}">＋ Item</button></div>`).join("")}</div>`}
function render(){let titles={today:"Hoje",week:"Semana",calendar:"Calendário",stats:"Estatísticas",notes:"Anotações"};$("title").textContent=titles[view];$("subtitle").textContent=view==="today"?new Date().toLocaleDateString("pt-BR",{weekday:"long",day:"numeric",month:"long"}):"";$("content").innerHTML=view==="today"?todayView():view==="week"?weekView():view==="calendar"?calendarView():view==="stats"?statsView():notesView();document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("active",b.dataset.view===view));bind();if(view==="today")weather()}
function bind(){document.querySelectorAll("[data-id]").forEach(x=>x.onclick=e=>{if(e.target.dataset.check)return;openDetail(+x.dataset.id)});document.querySelectorAll("[data-check]").forEach(x=>x.onclick=e=>{e.stopPropagation();let t=tasks.find(t=>t.id==x.dataset.check);t.completed=!t.completed;if(t.subtasks?.length&&t.subtasks.every(s=>s.done))t.completed=true;save();render()});$("pw")?.addEventListener("click",()=>{woff--;render()});$("nw")?.addEventListener("click",()=>{woff++;render()});$("tw")?.addEventListener("click",()=>{woff=0;render()});$("pm")?.addEventListener("click",()=>{moff--;render()});$("nm")?.addEventListener("click",()=>{moff++;render()});$("tm")?.addEventListener("click",()=>{moff=0;render()});$("addNote")?.addEventListener("click",()=>{if(notes.length<10)notes.push({id:Date.now(),title:"Novo bloco",items:[]});save();render()});document.querySelectorAll("[data-addnote]").forEach(b=>b.onclick=()=>{let n=notes.find(x=>x.id==b.dataset.addnote),x=prompt("Item:");if(x){n.items.push({text:x,done:false});save();render()}});document.querySelectorAll("[data-note]").forEach(x=>x.onchange=()=>{let[a,b]=x.dataset.note.split(":");notes.find(n=>n.id==a).items[b].done=x.checked;save()})}
function openTask(date=today(),t=null){editing=t?.id||null;$("mtitle").textContent=t?"Editar tarefa":"Nova tarefa";$("name").value=t?.title||"";$("date").value=t?.date||date;$("time").value=t?.time||"";$("duration").value=t?.duration||"";$("category").innerHTML=catOptions();$("category").value=t?.category||Object.keys(cats)[0];$("reminder").value=t?.reminder??"";$("desc").value=t?.desc||"";renderSubs(t?.subtasks||[]);$("taskModal").classList.add("open")}
function renderSubs(a){$("subs").innerHTML=a.map(s=>`<div class=subtask><input type=checkbox ${s.done?"checked":""}><input type=text value="${esc(s.text)}"><button type=button class=btn>×</button></div>`).join("");document.querySelectorAll("#subs .subtask button").forEach(b=>b.onclick=()=>b.parentElement.remove())}
$("addSub").onclick=()=>{let r=document.createElement("div");r.className="subtask";r.innerHTML='<input type=checkbox><input type=text placeholder="Subtarefa"><button type=button class=btn>×</button>';r.querySelector("button").onclick=()=>r.remove();$("subs").appendChild(r)}
$("form").onsubmit=e=>{e.preventDefault();let subs=[...document.querySelectorAll("#subs .subtask")].map(r=>({done:r.children[0].checked,text:r.children[1].value.trim()})).filter(x=>x.text),obj={title:$("name").value.trim(),date:$("date").value,time:$("time").value,duration:$("duration").value?+$("duration").value:"",category:$("category").value,reminder:$("reminder").value===""?"":+$("reminder").value,desc:$("desc").value.trim(),subtasks:subs,completed:subs.length?subs.every(x=>x.done):false};if(editing)Object.assign(tasks.find(t=>t.id===editing),obj);else tasks.push({id:Date.now(),...obj});save();$("taskModal").classList.remove("open");render();toast("Tarefa salva")}
function openDetail(id){detailId=id;let t=tasks.find(x=>x.id===id),c=cats[t.category]||{};$("detailTitle").textContent=t.title;$("detail").innerHTML=`<p><b>Data:</b> ${t.date}</p><p><b>Horário:</b> ${t.time||"Sem horário"}</p><p><b>Duração:</b> ${t.duration?t.duration+" min":"Não definida"}</p><p><b>Categoria:</b> ${esc(c.label||"")}</p><p><b>Descrição:</b> ${esc(t.desc||"—")}</p><p><b>Status:</b> ${t.completed?"Concluída ✓":"Pendente"}</p>${t.subtasks?.length?`<p><b>Subtarefas:</b> ${t.subtasks.filter(s=>s.done).length}/${t.subtasks.length}</p>`:""}`;$("detailModal").classList.add("open")}
$("edit").onclick=()=>{$("detailModal").classList.remove("open");openTask(null,tasks.find(t=>t.id===detailId))};$("delete").onclick=()=>{tasks=tasks.filter(t=>t.id!==detailId);save();$("detailModal").classList.remove("open");render()};$("duplicate").onclick=()=>{let t=tasks.find(t=>t.id===detailId);$("detailModal").classList.remove("open");openTask(t.date,{...t,id:null})};
$("new").onclick=()=>openTask();$("newSide").onclick=()=>openTask();$("cancel").onclick=()=>$("taskModal").classList.remove("open");$("collapse").onclick=()=>$("side").classList.toggle("collapsed");$("profile").onclick=()=>openSettings();
function openSettings(){$("username").value=localStorage.getItem("name")||"Usuário";$("weekstart").value=localStorage.getItem("weekstart")||"0";renderCats();$("settingsModal").classList.add("open")}
function renderCats(){$("cats").innerHTML=Object.entries(cats).map(([k,c])=>`<div class=catrow><input type=text data-label="${k}" value="${esc(c.label)}"><input type=color data-color="${k}" value="${c.color}"><button class=btn data-del="${k}">Excluir</button></div>`).join("");document.querySelectorAll("[data-del]").forEach(b=>b.onclick=()=>{delete cats[b.dataset.del];save();renderCats()})}
$("saveName").onclick=()=>{localStorage.setItem("name",$("username").value.trim()||"Usuário");$("settingsModal").classList.remove("open");render();toast("Nome atualizado")};$("closeSettings").onclick=()=>$("settingsModal").classList.remove("open");$("weekstart").onchange=()=>{localStorage.setItem("weekstart",$("weekstart").value);render()};$("addCat").onclick=()=>{cats["cat"+Date.now()]={label:"Nova categoria",color:"#6f927b"};save();renderCats()};$("cats").oninput=e=>{if(e.target.dataset.label)cats[e.target.dataset.label].label=e.target.value;if(e.target.dataset.color)cats[e.target.dataset.color].color=e.target.value;save()};
document.querySelectorAll("[data-theme]").forEach(b=>b.onclick=()=>{localStorage.setItem("theme",b.dataset.theme);theme()});
function theme(){let t=localStorage.getItem("theme")||"system",dark=t==="dark"||(t==="system"&&matchMedia("(prefers-color-scheme:dark)").matches);document.documentElement.style.setProperty("--bg",dark?"#111713":"#f4f7f5");document.documentElement.style.setProperty("--card",dark?"#19201b":"#fff");document.documentElement.style.setProperty("--text",dark?"#edf5ef":"#18231d");document.documentElement.style.setProperty("--muted",dark?"#a4b2a9":"#718078");document.documentElement.style.setProperty("--line",dark?"#303b34":"#dfe7e2")}theme();
document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>{view=b.dataset.view;render()});
function toast(s){$("toast").textContent=s;$("toast").classList.add("show");setTimeout(()=>$("toast").classList.remove("show"),1600)}
async function weather(){let box=$("weather");if(!box||!navigator.geolocation)return;navigator.geolocation.getCurrentPosition(async p=>{try{let r=await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${p.coords.latitude}&longitude=${p.coords.longitude}&current=temperature_2m,weather_code&timezone=auto`),d=await r.json();box.innerHTML=`<h3>Clima agora</h3><strong>${Math.round(d.current.temperature_2m)}°C</strong><div class=sub>Condições atuais</div>`}catch{box.innerHTML="<h3>Clima</h3><div class=sub>Não foi possível carregar.</div>"}},()=>box.innerHTML="<h3>Clima</h3><div class=sub>Permita a localização para ver o clima.</div>")}
render();
</script>
</body>
</html>
